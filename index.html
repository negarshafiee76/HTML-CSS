<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نمایش فیلدهای دیگر</title>
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <form>
        <label for="Collection name">نام مجموعه خود را انتخاب کنید</label>
        <select id="Collection name">
            <option value="option1">مجموعه فرهنگی ورزشی کارگران شهرستان ارومیه</option>
            <option value="option2">مجموعه فرهنگی ورزشی کارگران شهرستان بوکان</option>
            <option value="option3">مجموعه فرهنگی ورزشی کارگران شهرستان خوی</option>
            <option value="option4">مجموعه فرهنگی ورزشی کارگران شهرستان مهاباد</option>
            <option value="option5">مجموعه فرهنگی ورزشی کارگران شهرستان میاندوآب</option>
        </select>
        <br>
        <label for="mainField">  بهره برداری مجموعه:</label>
        <select id="mainField" onchange="showFields()">
            <option value="option">-- بهره برداری مجموعه --</option>
            <option value="option1"> خود گردان</option>
            <option value="option2">پیمانکار </option>
        </select>

        <div id="fieldsForOption1" class="hidden">
            <label for="field1_1">ورزش مورد نظر را انتخاب کنید:</label>
            <input type="radio" id="field1_1" name="field1_1">فوتبال
            <input type="radio" id="field1_1" name="field1_1">والیبال
            <input type="radio" id="field1_1" name="field1_1">استخر<br>
            <label for="field1_2">تعداد سانس :</label>
            <input type="text" id="field1_2" name="field1_2"><br>
        </div>

        <div id="fieldsForOption2" class="hidden">
            <label for="field2_1">فیلد ۲-۱:</label>
            <input type="text" id="field2_1" name="field2_1"><br>

            <label for="field2_2">فیلد ۲-۲:</label>
            <input type="text" id="field2_2" name="field2_2"><br>
        </div>
        <br>
        <button type="submit">ارسال</button>
    </form>

    <script>
        function showFields() {
            // مخفی کردن همه فیلدها
            document.getElementById('fieldsForOption1').classList.add('hidden');
            document.getElementById('fieldsForOption2').classList.add('hidden');

            // دریافت مقدار انتخاب شده
            var selectedValue = document.getElementById('mainField').value;

            // نمایش فیلدهای مرتبط با گزینه انتخاب شده
            if (selectedValue === 'option1') {
                document.getElementById('fieldsForOption1').classList.remove('hidden');
            } else if (selectedValue === 'option2') {
                document.getElementById('fieldsForOption2').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
